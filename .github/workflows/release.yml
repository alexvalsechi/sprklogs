name: Release Desktop

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      repair_tag:
        description: 'Existing release tag whose desktop assets must be rebuilt (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  publish:
    name: Calculate version, build and publish
    if: github.event_name == 'push'
    runs-on: windows-2022
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Calculate version and publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
        run: npx --no-install semantic-release

  repair-assets:
    name: Repair assets for an existing release
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_TAG: ${{ inputs.repair_tag }}
        run: |
          if ($env:REPAIR_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "repair_tag must use the format vX.Y.Z"
          }

          git show-ref --verify --quiet "refs/tags/$env:REPAIR_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $env:REPAIR_TAG does not exist"
          }

          gh release view $env:REPAIR_TAG --repo $env:GITHUB_REPOSITORY | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release $env:REPAIR_TAG does not exist"
          }

          git checkout --detach $env:REPAIR_TAG
          if ($LASTEXITCODE -ne 0) {
            throw "Could not checkout $env:REPAIR_TAG"
          }

          "version=$($env:REPAIR_TAG.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and validate assets
        shell: powershell
        env:
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
        run: >-
          ./infra/scripts/package-desktop-win.ps1
          -Version ${{ steps.release.outputs.version }}
          -Target nsis
          -SkipInstall
          -DisableExecutableSigning

      - name: Replace only missing or corrupted assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_TAG: ${{ inputs.repair_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $remoteDir = Join-Path $env:RUNNER_TEMP 'published-assets'
          New-Item -ItemType Directory -Path $remoteDir -Force | Out-Null

          $localAssets = @(
            (Get-Item "apps/desktop/dist/SprkLogs-setup-v$env:VERSION.exe"),
            (Get-Item 'apps/desktop/dist/checksums.txt')
          )

          foreach ($asset in $localAssets) {
            gh release download $env:REPAIR_TAG --pattern $asset.Name --dir $remoteDir
            $remoteAsset = Join-Path $remoteDir $asset.Name
            $remoteMatches = $LASTEXITCODE -eq 0 -and
              (Test-Path -LiteralPath $remoteAsset) -and
              ((Get-FileHash -LiteralPath $remoteAsset -Algorithm SHA256).Hash -eq
                (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash)

            if ($remoteMatches) {
              Write-Host "$($asset.Name) is already valid; keeping the published asset."
              continue
            }

            gh release upload $env:REPAIR_TAG $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not upload $($asset.Name) to $env:REPAIR_TAG"
            }
          }

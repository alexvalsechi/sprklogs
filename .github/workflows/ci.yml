name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      desktop: ${{ steps.paths.outputs.desktop }}
      web: ${{ steps.paths.outputs.web }}
      package: ${{ steps.paths.outputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0

      - name: Classify changes
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          backend=false
          desktop=false
          web=false
          package=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              backend/*|infra/scripts/build-python.ps1|infra/scripts/build-python.sh)
                backend=true
                package=true
                ;;
            esac
            case "$file" in
              apps/desktop/*|packages/ipc-types/*|packages/ui/*|package.json|package-lock.json|infra/scripts/package-desktop-win.ps1|infra/scripts/build-desktop-local.ps1)
                desktop=true
                package=true
                ;;
            esac
            case "$file" in
              apps/web/*)
                web=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend test suite
        run: pytest tests -q

  desktop-check:
    name: Desktop integrity check
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate desktop package
        run: npm run check --workspace @log-sparkui/desktop

  web-check:
    name: Web static check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Validate institutional page and downloads
        shell: bash
        run: |
          test -f apps/web/index.html
          grep -q 'id="nav-download-exe"' apps/web/index.html
          grep -q 'id="cta-download-exe"' apps/web/index.html
          grep -q 'hydrateExeLinks' apps/web/index.html
          if grep -q 'master-latest' apps/web/index.html; then
            echo 'The website must not reference master-latest.' >&2
            exit 1
          fi

  package-windows:
    name: Package Windows installer
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Build and validate installer
        shell: powershell
        run: >-
          ./infra/scripts/package-desktop-win.ps1
          -Version 0.0.0-pr.${{ github.event.pull_request.number }}
          -Target nsis
          -SkipInstall
          -DisableExecutableSigning
